name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check examples
        run: cargo check --examples --all-features

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable toolchain for dependency resolution
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.75

      - name: Build library with the newest dependencies
        run: cargo build --lib

      - name: Resolve dependencies compatible with the MSRV
        run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Run tests
        run: cargo test --locked

      - name: Check examples
        run: cargo check --examples --locked

  pytorch-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU)
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Export reference cases
        run: cargo run --release --example export_reference_cases -- validation/cases.json

      - name: Compare with PyTorch
        run: python validation/pytorch_parity.py validation/cases.json
